context:
  version: "1.16.0"

package:
  name: gospel
  version: ${{ version }}

source:
  url: https://github.com/kortschak/gospel/archive/v${{ version }}.tar.gz
  sha256: d746162a6f2924147270599610a02433ac033a66882bfeac9639a43e3e7700f1

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('go-cgo') }}
    - ${{ stdlib('c') }}
    - go-licenses
    - pkg-config
  host:
    - hunspell
  run:
    - hunspell

tests:
  - script:
      - gospel --help

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - license-files/
  summary: misspelled word linter for Go comments, string literals and embedded files
  homepage: https://github.com/kortschak/gospel
  repository: https://github.com/kortschak/gospel

extra:
  recipe-maintainers:
    - danielnachun
